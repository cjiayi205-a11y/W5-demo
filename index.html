<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逢甲美食地圖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background-color: #e8f5e9;
            color: #333;
        }

        header {
            background-color: #ff6f00;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #e65100;
        }

        header h1 {
            color: #ffffff;
            font-size: 1.8em;
        }

        header p {
            color: #fff3e0;
            margin-top: 5px;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background-color: #fff;
            flex-wrap: wrap;
        }

        .filter-bar button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background-color: #fff;
            cursor: pointer;
            font-size: 0.9em;
        }

        .filter-bar button.active {
            background-color: #ff6f00;
            color: #fff;
            border-color: #ff6f00;
        }

        .restaurant-list {
            max-width: 700px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .restaurant-card {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .restaurant-card h2 {
            font-size: 1.2em;
            color: #333;
        }

        .restaurant-card .tag {
            display: inline-block;
            background-color: #fff3e0;
            color: #e65100;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            margin: 8px 4px 8px 0;
        }

        .restaurant-card .details {
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .restaurant-card .price {
            font-weight: bold;
            color: #e65100;
        }

        .restaurant-card .rating {
            color: #fbc02d;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <h1>🎓 大學生存指南 — 省錢篇</h1>
    <p style="text-align:center; color:#888;">錢要花在刀口上，月底才不會吃土</p>

    <div class="tip">
        <h3>☕ 提神秘技</h3>
        <p>早八的救星：自己帶保溫瓶裝黑咖啡，一個月省下 800 元。</p>
    </div>

    <div class="tip">
        <h3>🍜 覓食法則</h3>
        <p>午餐尖峰時段是 12:00～12:30，建議 12:35 再去，人少又有折扣便當。</p>
    </div>

    <div class="tip">
        <h3>📖 期末生存術</h3>
        <p>不用去圖書館人擠人，找空教室才是真正的秘密基地，安靜又有冷氣。</p>
    </div>

    <div class="tip">
        <h3>💰 省錢妙招</h3>
        <p>教科書先問學長姐借，或上二手社團找，原價買書是大一才會做的事。</p>
    </div>

    <div class="footer">
        <p>大學生存指南 v1.1 — 月底不吃土攻略 💸</p>
    </div>

    <footer>
        <p>逢甲美食地圖 &copy; 2025 — 由進階程式設計課程製作</p>
    </footer>

</body>
</html>
